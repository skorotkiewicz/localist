name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event.created && !github.event.deleted
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Install shared frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: tauri
        run: bun install --frozen-lockfile

      - name: Test frontend
        run: bun run test

      - name: Test Rust backend
        run: cargo test --locked --manifest-path tauri/src-tauri/Cargo.toml --lib

      - name: Use tag version
        id: version
        run: |
          bun -e '
            const file = "tauri/src-tauri/tauri.conf.json"
            const config = await Bun.file(file).json()
            const version = process.env.GITHUB_REF_NAME.slice(1)
            config.version = version
            await Bun.write(file, JSON.stringify(config, null, 2))
            await Bun.write(process.env.GITHUB_OUTPUT, `prerelease=${version.split("+")[0].includes("-")}\n`)
          '

      - name: Build installers and upload draft assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tauriScript: bun run tauri
          args: ${{ matrix.args }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: Localist ${{ github.ref_name }}
          releaseBody: Download the installer for your platform or a standalone Linux publishing server below. These builds are unsigned.
          releaseDraft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false

  build-server:
    name: Build standalone publishing server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: publish-server
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test publishing server and token helper
        run: |
          go test -race ./...
          node --test token.test.mjs

      - name: Build standalone Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o localist-publish-linux-amd64 .
          GOARCH=arm64 go build -trimpath -o localist-publish-linux-arm64 .

      - name: Upload server binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" localist-publish-linux-amd64 localist-publish-linux-arm64 ../LICENSE --clobber

  publish:
    needs: [build, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  aur-publish:
    name: Build Arch package and publish to AUR
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install packaging tools and create builder
        run: |
          pacman -Syu --noconfirm --needed git openssh github-cli
          useradd --create-home builder

      - name: Download release files and calculate SHA-256
        working-directory: arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          sed -i "s/^_version=.*/_version=$version/" PKGBUILD
          gh release download "$GITHUB_REF_NAME" --pattern "localist_${version}_amd64.deb" --pattern LICENSE --dir .
          checksum=$(sha256sum "localist_${version}_amd64.deb" | cut -d ' ' -f1)
          license_checksum=$(sha256sum LICENSE | cut -d ' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$checksum' '$license_checksum')/" PKGBUILD

      - name: Build Arch package and generate .SRCINFO
        working-directory: arch
        run: |
          chown -R builder:builder .
          runuser -u builder -- bash -euo pipefail -c '
            source PKGBUILD
            [[ "${sha256sums[0]}" =~ ^[0-9a-f]{64}$ && "${sha256sums[1]}" =~ ^[0-9a-f]{64}$ ]]
            makepkg --nodeps --noconfirm
            makepkg --printsrcinfo > .SRCINFO
          '
          bsdtar -tf ./*.pkg.tar.zst | grep -Ex '(\./)?usr/bin/localist'
          bsdtar -tf ./*.pkg.tar.zst | grep -Ex '(\./)?usr/share/licenses/localist-bin/LICENSE'

      - name: Upload Arch package and checksummed PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" arch/*.pkg.tar.zst arch/PKGBUILD --clobber

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: localist-bin
          pkgbuild: ./arch/PKGBUILD
          assets: ./arch/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'aur: ${{ github.ref_name }}'
          ssh_keyscan_types: rsa,ecdsa,ed25519
